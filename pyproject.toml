[project]
name = "bytestay-distill-mcp"
version = "0.2.2"
description = "Web page to clean Markdown for LLM agents, honouring robots.txt and AI opt-outs. Bring your own RapidAPI or api.market key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ByteStay", email = "hello@bytestay.pt" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://distill.bytestay.pt"
Repository = "https://github.com/bytestay/distill-mcp"
Issues = "https://github.com/bytestay/distill-mcp/issues"
Changelog = "https://github.com/bytestay/distill-mcp/blob/main/CHANGELOG.md"

[project.scripts]
distill-mcp = "distill_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distill_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=distill_mcp --cov-report=term-missing:skip-covered --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
